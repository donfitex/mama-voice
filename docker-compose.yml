services:
  ollama:
    image: ollama/ollama
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]
  api:
    build: .
    environment:
      MV_OLLAMA_URL: http://ollama:11434
    ports: ["8000:8000"]
    depends_on: [ollama]
  mlflow:
    image: ghcr.io/mlflow/mlflow
    command: mlflow server --host 0.0.0.0
    ports: ["5000:5000"]
volumes:
  ollama:
